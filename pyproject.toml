[project]
name = "rag-emean"
version = "0.1.0"
description = "Study of the warm start of e-means"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib"]

[dependency-groups]
dev = [
    "faiss-cpu==1.16.0",
    "pytest",
]
real = [
    "datasets>=5.2.0",
    "sentence-transformers>=6.3.0",
]

[tool.pytest.ini_options]
norecursedirs = ["vendor", ".*", "data", "_bmad"]
